[server]
# Matches the intake limit in src/intake.py (MAX_FILE_BYTES = 20 MB per photo).
maxUploadSize = 20
runOnSave = false

[browser]
gatherUsageStats = false

[client]
# Product UI: no developer toolbar/"Deploy" button for viewers. The app shows its own
# readable error panels; tracebacks go to the server console only.
toolbarMode = "minimal"
showErrorDetails = "type"

# Design tokens: slate neutrals, one blue accent, semantic status colours.
# Custom CSS in ui/style.py only adds what the theme cannot express (card shadows, chips).
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#CBD5E1"
showWidgetBorder = true
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeHeaderTextColor = "#334155"
font = '"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif'
headingFont = '"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif'
baseFontSize = 16
baseRadius = "8px"
buttonRadius = "8px"
headingFontSizes = ["1.75rem", "1.375rem", "1.125rem", "1rem", "1rem", "1rem"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
redColor = "#DC2626"
redTextColor = "#B91C1C"
redBackgroundColor = "#FEF2F2"
orangeColor = "#EA8C00"
orangeTextColor = "#B45309"
orangeBackgroundColor = "#FFF7ED"
yellowColor = "#CA8A04"
yellowTextColor = "#854D0E"
yellowBackgroundColor = "#FEFCE8"
greenColor = "#16A34A"
greenTextColor = "#15803D"
greenBackgroundColor = "#F0FDF4"
blueColor = "#2563EB"
blueTextColor = "#1D4ED8"
blueBackgroundColor = "#EFF6FF"
grayColor = "#64748B"
grayTextColor = "#475569"
grayBackgroundColor = "#F1F5F9"
violetColor = "#7C3AED"
violetTextColor = "#6D28D9"
violetBackgroundColor = "#F5F3FF"
